    },
    coffee(ctx, w, h, t){
      const prog = Math.min(1, (t % 6) / 4.5), k = Math.LN2 / 5, ka = 4.6;
      const lvl = x => [[2.5, 95], [5, 30], [5.5, 30], [10.5, 60]].reduce((s, [t0, d]) => x > t0 ? s + d * ka / (ka - k) * (Math.exp(-k * (x - t0)) - Math.exp(-ka * (x - t0))) : s, 0);

      ctx.strokeStyle = dark() ? '#D59A6A' : '#7B4B2A'; ctx.lineWidth = 2.5; ctx.beginPath();
      for (let x = 0; x <= 24 * prog; x += .1){ const px = X(x), py = Y(lvl(x)); x ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
      ctx.strokeStyle = dark() ? '#8FB0E6' : '#2F4C7A'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(17.5), 14); ctx.lineTo(X(17.5), h - 14); ctx.stroke();
    },
    plate(ctx, w, h, t){
      const S = h - 16, ox = (w - S) / 2, oy = 8, show = (t % 5) < 3.2;
      for (const [x, y, r, fig, l] of plateDots){
        const c = fig && show ? [200 * l, 122 * l, 104 * l] : [150 * l, 160 * l, 92 * l];

    },
    heart(ctx, w, h, t){

      ctx.fillStyle = dark() ? '#EDEDEF' : '#17171A';
      const txt = nf.format(beats);
      let fs = 48; do { ctx.font = `900 ${fs}px "Big Shoulders Display", system-ui, sans-serif`; fs -= 2; } while (fs > 14 && ctx.measureText(txt).width > w - 76);
      ctx.textBaseline = 'middle'; ctx.fillText(txt, 60, h / 2 + 2);
    },
    triage(ctx, w, h, t){
      const cols = ['#C6372A', '#C6372A', '#D89A0A', '#D89A0A', '#2A8350', '#2A8350'];
      const step = Math.floor(t / .7) % 9, n = Math.min(6, step);
      const gap = w / 7;
      for (let i = 0; i < 6; i++){
        const x = gap * (i + 1), y = h / 2;
        ctx.lineWidth = 2;
        if (i < n){ ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.arc(x, y, 17, 0, 7); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '800 17px "Instrument Sans", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(i + 1, x, y + 1); ctx.textAlign = 'left'; }
        else { ctx.strokeStyle = dark() ? '#3a3a40' : '#C9C9C3'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
      }
    },
    duel(ctx, w, h, t){
      const pairs = [['9,1 milyon', '6'], ['597.000', '7.555'], ['1,19 milyon', '300.000']];
      const k = Math.floor(t / 2.4) % pairs.length, local = (t % 2.4) / 2.4;
      const [a, b] = pairs[k];
      const ink = dark() ? '#EDEDEF' : '#17171A';
      let fs = 34; do { ctx.font = `700 ${fs}px "Instrument Sans", system-ui, sans-serif`; fs -= 2; } while (fs > 12 && Math.max(ctx.measureText(a).width, ctx.measureText(b).width) > w * .34);
      const big = ctx.font; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.fillStyle = ink; ctx.fillText(a, w * .27, h / 2);
      ctx.fillStyle = dark() ? '#A0A0A8' : '#66666E'; ctx.font = '600 15px "Instrument Sans", system-ui, sans-serif'; ctx.fillText('vs', w / 2, h / 2);
      ctx.font = big;
      if (local > .45){ ctx.fillStyle = '#0E7C66'; ctx.fillText(b, w * .73, h / 2); }
      else { ctx.fillStyle = dark() ? '#3a3a40' : '#D9D9D4'; ctx.fillText('?', w * .73, h / 2); }
      ctx.textAlign = 'left';
    },
    arrest(ctx, w, h, t){
      const D = dark();
      ctx.strokeStyle = D ? 'rgba(255,255,255,.07)' : '#F2CFC9'; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = 0; x < w; x += 10){ ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); } for (let y = 0; y < h; y += 10){ ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); } ctx.stroke();
      const cyc = (t % 8) / 8;

      }
      ctx.stroke();
      ctx.fillStyle = D ? '#EDEDEF' : '#2A2530'; ctx.font = '800 22px "Big Shoulders Display", system-ui, sans-serif'; ctx.textBaseline = 'top';
      const s = Math.floor(cyc * 600); ctx.fillText(String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'), 12, 10);
    },
    ecg(ctx, w, h, t){
      const D = dark();

      for (let x = 0; x <= Math.min(w, sweep); x++){
        const tau = ((x / w) * 2.4) % .8;
        const y = h * .6 - ecgBeat(tau, .3) * 55;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      const left = 1 - ((t % 10) / 10);
      ctx.fillStyle = '#E0A100'; ctx.fillRect(0, h - 6, w * left, 6);
    }
  };

  const items = [...document.querySelectorAll('canvas[data-p]')].map(cv => ({ cv, fn: draw[cv.dataset.p], vis: true, w: 0, h: 0, ctx: null }));
  function size(it){
    const dpr = Math.min(window.devicePixelRatio || 1, 2), r = it.cv.getBoundingClientRect();
    it.w = r.width || 300; it.h = r.height || 150;
    it.cv.width = Math.round(it.w * dpr); it.cv.height = Math.round(it.h * dpr);
    it.ctx = it.cv.getContext('2d'); if (it.ctx) it.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  items.forEach(size);
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => { const it = items.find(i => i.cv === e.target); if (it) it.vis = e.isIntersecting; }));
    items.forEach(it => io.observe(it.cv));
  }
  const t0 = performance.now();
  function frame(now){
    const t = reduce ? 3.1 : (now - t0) / 1000;
    items.forEach(it => { if (!it.vis || !it.ctx) return; it.ctx.clearRect(0, 0, it.w, it.h); it.fn(it.ctx, it.w, it.h, t); });

  }
  requestAnimationFrame(frame);
  let rs; window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { items.forEach(size); if (reduce) frame(performance.now()); }, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (reduce) frame(performance.now()); });
})();
</script>
<script>
(() => {
  const cv = document.getElementById('logo');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'), h1 = cv.parentElement;
  const HUES = [356, 198, 28, 80, 342, 165, 12, 42, 262];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dots = [], W = 0, H = 0, F = 200, px = -1e5, py = -1e5, running = false, lastW = -1;

  function build(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(200, Math.min(h1.clientWidth || 600, 760));
    const m = document.createElement('canvas').getContext('2d');
    m.font = '900 100px "Big Shoulders Display", system-ui, sans-serif';
    const mt = m.measureText('Aha');
    const tw = (mt.actualBoundingBoxRight || mt.width) + (mt.actualBoundingBoxLeft || 0) || 150;
    const asc = mt.actualBoundingBoxAscent || 75;
    F = Math.min(340, (W - 8) / tw * 100);
    const pad = F * .06;
    H = Math.round(asc / 100 * F + pad * 2);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const mk = document.createElement('canvas'); mk.width = W; mk.height = H;
    const mc = mk.getContext('2d');
    mc.font = `900 ${F}px "Big Shoulders Display", system-ui, sans-serif`;
    mc.fillText('Aha', 4 + (mt.actualBoundingBoxLeft || 0) / 100 * F, pad + asc / 100 * F);
    const data = mc.getImageData(0, 0, W, H).data;
    const inside = (x, y) => { x |= 0; y |= 0; return x >= 0 && y >= 0 && x < W && y < H && data[(y * W + x) * 4 + 3] > 140; };
    const rMin = Math.max(1.4, F * .010), rMax = Math.max(3, F * .026), cell = rMax * 2, grid = new Map();
    const out = [];
    for (let t = 0; t < 16000 && out.length < 1600; t++){
      const r = rMin + (rMax - rMin) * Math.random() ** 1.5;
      const x = Math.random() * W, y = Math.random() * H;
      if (!inside(x, y) || !inside(x + r * .6, y) || !inside(x - r * .6, y) || !inside(x, y + r * .6) || !inside(x, y - r * .6)) continue;
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
      let ok = true;
      for (let i = gx - 1; i <= gx + 1 && ok; i++) for (let j = gy - 1; j <= gy + 1 && ok; j++){
        const l = grid.get(i + ',' + j); if (!l) continue;
        for (const o of l){ if ((o.tx - x) ** 2 + (o.ty - y) ** 2 < (o.r + r + 1) ** 2){ ok = false; break; } }
      }
      if (!ok) continue;
      const h = HUES[Math.floor(Math.random() * HUES.length)];
      const d = { tx: x, ty: y, r, col: `hsl(${h} ${62 + Math.random() * 18}% ${44 + Math.random() * 16}%)`,
        x: reduce ? x : Math.random() * W, y: reduce ? y : Math.random() * H * 1.6 - H * .3, vx: 0, vy: 0 };
      out.push(d); const k = gx + ',' + gy; (grid.get(k) || grid.set(k, []).get(k)).push(d);
    }
    dots = out;
    document.documentElement.classList.add('logo-on');
    kick();
  }
  function frame(){
    ctx.clearRect(0, 0, W, H);
    let moving = false;
    const R = F * .3, R2 = R * R, push = F * .055;
    for (const d of dots){
      if (!reduce){
        let ax = (d.tx - d.x) * .055, ay = (d.ty - d.y) * .055;
        const dx = d.x - px, dy = d.y - py, q = dx * dx + dy * dy;
        if (q < R2){ const dist = Math.sqrt(q) || 1, f = (1 - dist / R) * push; ax += dx / dist * f; ay += dy / dist * f; }
        d.vx = (d.vx + ax) * .8; d.vy = (d.vy + ay) * .8; d.x += d.vx; d.y += d.vy;
        if (Math.abs(d.vx) + Math.abs(d.vy) > .04 || Math.abs(d.tx - d.x) + Math.abs(d.ty - d.y) > .25) moving = true;
      }
      ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    }
    if (moving || px > -1e4) requestAnimationFrame(frame); else running = false;
  }
  function kick(){ if (!running){ running = true; requestAnimationFrame(frame); } }
  const pos = e => { const b = cv.getBoundingClientRect(); px = e.clientX - b.left; py = e.clientY - b.top; kick(); };
  if (!reduce){
    cv.addEventListener('pointermove', pos);
    cv.addEventListener('pointerdown', pos);
    cv.addEventListener('pointerleave', () => { px = py = -1e5; kick(); });
    cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse'){ px = py = -1e5; kick(); } });
    cv.addEventListener('pointercancel', () => { px = py = -1e5; kick(); });
  }
  let rs;
  window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { const w = Math.min(h1.clientWidth, 760); if (w !== lastW){ lastW = w; build(); } }, 150); });
  const go = () => { lastW = Math.min(h1.clientWidth, 760); build(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
})();
</script>
